<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Invisible Battlefield — Electronic Attack Explained</title>
<style>
:root{
  --bg0:#0a0f1d; --bg1:#050811;
  --glass:rgba(12,19,36,0.78); --edge:rgba(0,240,255,0.22);
  --cyan:#00f0ff; --amber:#ffaa00; --red:#ff2a55; --violet:#b026ff; --green:#00e676;
  --text:#e6f1ff; --muted:#8ea3c0; --dim:#5b6d88;
  --sans:Inter,"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;
  --mono:"JetBrains Mono",Consolas,"Cascadia Mono",Menlo,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:radial-gradient(ellipse at 50% 30%,#0f1730 0%,var(--bg0) 45%,var(--bg1) 100%);color:var(--text);font-family:var(--sans);-webkit-font-smoothing:antialiased}
#stage{position:fixed;inset:0;width:100%;height:100%;display:block;outline:none}
.glass{background:var(--glass);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid var(--edge);border-radius:14px;box-shadow:0 12px 40px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.04)}

/* header */
#header{position:fixed;top:18px;left:18px;width:min(470px,calc(100vw - 400px));padding:16px 20px 18px;z-index:5;transition:opacity .35s ease,transform .35s ease}
#header.swap{opacity:0;transform:translateY(-10px)}
.badges{display:flex;gap:8px;align-items:center;margin-bottom:11px;font-family:var(--mono);font-size:11px;letter-spacing:.12em}
.badge{padding:4px 9px;border-radius:6px;border:1px solid var(--edge);color:var(--cyan);background:rgba(0,240,255,.07);white-space:nowrap}
.badge.time{color:var(--amber);border-color:rgba(255,170,0,.35);background:rgba(255,170,0,.07)}
.badge.live{margin-left:auto;color:var(--green);border-color:rgba(0,230,118,.3);background:rgba(0,230,118,.06)}
.badge.live::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--green);margin-right:6px;box-shadow:0 0 8px var(--green);animation:blink 1.6s infinite;vertical-align:1px}
@keyframes blink{50%{opacity:.25}}
#title{font-size:clamp(21px,2.05vw,31px);font-weight:750;line-height:1.14;letter-spacing:-.015em}
#subtitle{margin-top:8px;color:var(--muted);font-size:clamp(13px,1vw,15.5px);line-height:1.5}
#analogy{margin-top:13px;display:flex;gap:10px;align-items:flex-start;padding:9px 12px;border-radius:10px;background:rgba(255,170,0,.08);border:1px solid rgba(255,170,0,.28);color:#ffd88a;font-size:13.5px;line-height:1.45;font-style:italic}
#analogy::before{content:"ANALOGY";font-style:normal;font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;color:var(--amber);padding-top:3px;flex:none}
#analogy:empty{display:none}

/* right panel */
#panel{position:fixed;top:18px;right:18px;bottom:86px;width:350px;padding:14px;z-index:5;display:flex;flex-direction:column;gap:12px;overflow-y:auto;scrollbar-width:thin;scrollbar-color:rgba(0,240,255,.25) transparent}
.hudbox{border:1px solid rgba(0,240,255,.18);border-radius:10px;background:rgba(3,8,18,.75);padding:8px;flex:none}
.hudtitle{font-family:var(--mono);font-size:10px;letter-spacing:.14em;color:var(--cyan);display:flex;justify-content:space-between;margin-bottom:6px}
.hudtitle span:last-child{color:var(--dim)}
#hud{width:100%;aspect-ratio:312/230;display:block;border-radius:6px}
#controls{display:flex;flex-direction:column;gap:12px}
.sec h4{font-family:var(--mono);font-size:10px;letter-spacing:.15em;color:var(--muted);font-weight:500;margin:2px 0 8px;text-transform:uppercase}
.btns{display:flex;flex-direction:column;gap:7px}
.btns.row{flex-direction:row;flex-wrap:wrap}
.btns.row .btn{flex:1 1 40%}
.btn{--c:0,240,255;font:600 13px/1.3 var(--sans);color:var(--text);background:rgba(255,255,255,.035);border:1px solid rgba(142,163,192,.24);border-radius:9px;padding:9px 12px;text-align:left;cursor:pointer;transition:border-color .18s,background .18s,box-shadow .18s,transform .1s}
.btn:hover{border-color:rgba(var(--c),.8);background:rgba(var(--c),.08)}
.btn:active{transform:scale(.985)}
.btn.on{border-color:rgb(var(--c));background:rgba(var(--c),.16);box-shadow:0 0 0 1px rgba(var(--c),.25),0 0 18px rgba(var(--c),.16)}
.btn small{display:block;font-weight:400;color:var(--muted);font-size:11.5px;margin-top:2px}
.btn.red{--c:255,42,85}.btn.amber{--c:255,170,0}.btn.violet{--c:176,38,255}.btn.green{--c:0,230,118}
.btn.ghost{background:transparent;color:var(--muted);font-weight:500}
.btn:disabled{opacity:.45;cursor:not-allowed}
.slider{padding:2px 2px 0}
.sl-top{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);margin-bottom:6px}
.sl-top b{font-family:var(--mono);color:var(--cyan);font-weight:600;font-size:11.5px}
.sl-ends{display:flex;justify-content:space-between;font-family:var(--mono);font-size:10px;color:var(--dim);margin-top:4px;letter-spacing:.06em}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:6px;border-radius:4px;background:linear-gradient(90deg,rgba(0,240,255,.15),rgba(255,42,85,.35));outline:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:#e6f1ff;border:3px solid var(--cyan);box-shadow:0 0 12px rgba(0,240,255,.6);cursor:pointer}
input[type=range]::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:#e6f1ff;border:3px solid var(--cyan);cursor:pointer}
.note{font-size:12.5px;color:var(--muted);line-height:1.55;padding:9px 11px;border-left:2px solid var(--cyan);background:rgba(0,240,255,.045);border-radius:0 8px 8px 0}
.note b{color:var(--text);font-weight:600}
.sec>.btn{display:block;width:100%;margin-bottom:7px}
.sec>.btn:last-child{margin-bottom:0}
.note.red{border-color:var(--red);background:rgba(255,42,85,.06)}
.note.amber{border-color:var(--amber);background:rgba(255,170,0,.06)}
.note.violet{border-color:var(--violet);background:rgba(176,38,255,.07)}
.card{border:1px solid rgba(0,240,255,.2);border-radius:10px;padding:11px 12px;background:rgba(0,240,255,.04)}
.card .ct{font-family:var(--mono);font-size:10px;letter-spacing:.14em;color:var(--cyan);margin-bottom:4px}
.card h3{font-size:16px;font-weight:700;margin-bottom:2px}
.card .tag{font-size:12.5px;color:var(--amber);margin-bottom:8px}
.card ul{list-style:none;display:flex;flex-direction:column;gap:6px}
.card li{font-size:12.5px;line-height:1.45;color:#c9d7ea;padding-left:14px;position:relative}
.card li::before{content:"";position:absolute;left:0;top:7px;width:6px;height:6px;border-radius:2px;background:var(--cyan);box-shadow:0 0 6px var(--cyan)}
.take ol{list-style:none;counter-reset:t;display:flex;flex-direction:column;gap:8px}
.take li{counter-increment:t;font-size:12.8px;line-height:1.45;color:#d5e2f3;padding-left:30px;position:relative}
.take li::before{content:counter(t);position:absolute;left:0;top:0;width:21px;height:21px;border-radius:6px;display:grid;place-items:center;font:700 11px var(--mono);color:#050811;background:var(--cyan)}
.qa{margin-top:10px;text-align:center;padding:10px;border-radius:9px;font:700 14px var(--mono);letter-spacing:.08em;color:var(--green);border:1px dashed rgba(0,230,118,.5);background:rgba(0,230,118,.06);animation:qa 2.4s ease-in-out infinite}
@keyframes qa{50%{box-shadow:0 0 22px rgba(0,230,118,.25)}}

/* nav */
#nav{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);display:flex;align-items:center;gap:12px;padding:8px 12px;z-index:6;max-width:calc(100vw - 24px)}
.navbtn{font:600 12.5px var(--sans);color:var(--text);background:rgba(255,255,255,.04);border:1px solid rgba(142,163,192,.25);border-radius:8px;padding:7px 12px;cursor:pointer;white-space:nowrap;transition:all .16s}
.navbtn:hover{border-color:var(--cyan);background:rgba(0,240,255,.1)}
.navbtn.on{border-color:var(--amber);color:var(--amber)}
#dots{display:flex;gap:7px;align-items:center}
.dot{width:12px;height:12px;border-radius:50%;border:1px solid rgba(0,240,255,.55);background:transparent;cursor:pointer;position:relative;transition:all .2s;padding:0}
.dot:hover{border-color:var(--cyan);background:rgba(0,240,255,.25)}
.dot.done{background:rgba(0,240,255,.32)}
.dot.cur{background:var(--cyan);box-shadow:0 0 10px var(--cyan);transform:scale(1.25)}
.dot .tip{position:absolute;bottom:23px;left:50%;transform:translateX(-50%) translateY(4px);white-space:nowrap;font:500 11.5px var(--sans);color:var(--text);background:rgba(8,14,28,.95);border:1px solid var(--edge);border-radius:7px;padding:5px 9px;opacity:0;pointer-events:none;transition:all .15s}
.dot .tip b{font-family:var(--mono);color:var(--cyan);margin-right:6px;font-size:10.5px}
.dot:hover .tip{opacity:1;transform:translateX(-50%) translateY(0)}
.sep{width:1px;height:24px;background:rgba(142,163,192,.25)}
#timer{display:flex;align-items:center;gap:7px;font-family:var(--mono);font-size:12px}
#tElapsed{font-size:14px;font-weight:700;color:var(--green);min-width:46px;text-align:right}
#tElapsed.warn{color:var(--amber)}#tElapsed.over{color:var(--red)}
#timer .tt{color:var(--dim);font-size:10.5px;letter-spacing:.08em;white-space:nowrap}
#timer button{width:28px;height:28px;border-radius:7px;border:1px solid rgba(142,163,192,.25);background:rgba(255,255,255,.04);color:var(--text);cursor:pointer;font-size:12px}
#timer button:hover{border-color:var(--cyan)}

/* notes */
#notes{position:fixed;left:18px;right:386px;bottom:80px;max-height:36vh;padding:14px 20px 16px;z-index:7;overflow:auto;transform:translateY(calc(100% + 120px));opacity:0;transition:transform .38s ease,opacity .3s}
#notes.open{transform:none;opacity:1}
.nhead{display:flex;justify-content:space-between;align-items:center;font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;color:var(--amber);margin-bottom:8px}
.nhead .k{color:var(--dim)}
#notesBody{font-size:15px;line-height:1.65;color:#dbe6f5}
#notesBody p{margin-bottom:8px}
#notesBody .cue{font-family:var(--mono);font-size:11.5px;color:var(--amber);background:rgba(255,170,0,.1);padding:1px 6px;border-radius:4px;margin-right:4px}
#notesBody .act{color:var(--cyan);font-style:italic}

#hint{position:fixed;left:20px;bottom:24px;font-family:var(--mono);font-size:10.5px;color:var(--dim);letter-spacing:.06em;z-index:4;pointer-events:none}
#err{position:fixed;inset:0;display:none;align-items:center;justify-content:center;text-align:center;padding:40px;z-index:20;background:#050811;color:var(--text);font-size:16px;line-height:1.6}
@media (max-width:1400px){#hint{display:none}}
@media (min-width:1800px) and (min-height:1000px){#header,#panel,#nav,#notes{zoom:1.25}#panel{bottom:76px}#notes{right:374px}}
@media (max-height:780px){
  #header{padding:12px 16px 14px}
  #title{font-size:21px}
  #subtitle{font-size:13px;margin-top:6px}
  #analogy{margin-top:9px;font-size:12.5px;padding:7px 10px}
  #panel{padding:11px;gap:10px;width:330px}
  .btn{padding:7px 11px;font-size:12.5px}
  .btn small{font-size:11px}
  .note{font-size:12px;padding:7px 10px}
  #notes{right:362px}
}

/* ---------- phone layout: compact title, tabbed bottom sheet ---------- */
#mbody{display:flex;flex-direction:column;gap:12px}
#mtabs,#mtitle,#mcount{display:none}
@media (max-width:760px),(max-height:500px){
  #hint,#dots,#timer,.sep,#notesBtn{display:none!important}
  #mtitle{display:flex;position:fixed;top:10px;left:10px;right:10px;z-index:6;align-items:center;gap:8px;padding:8px 12px;font-size:13.5px;font-weight:700;white-space:nowrap;overflow:hidden}
  #mtitle .badge{flex:none;font-size:10px;padding:3px 7px}
  #mtitle .tt{overflow:hidden;text-overflow:ellipsis}
  #nav{left:8px;right:8px;bottom:8px;transform:none;justify-content:space-between;padding:6px 8px;max-width:none}
  #mcount{display:block;font:700 13px var(--mono);color:var(--cyan);letter-spacing:.08em}
  .navbtn{padding:10px 18px;font-size:14px}
  #panel{top:auto;left:8px;right:8px;bottom:68px;width:auto;height:min(50vh,470px);padding:0;gap:0;overflow:hidden;transition:height .3s ease}
  #panel.collapsed{height:48px}
  #mtabs{display:flex;flex:none;gap:4px;padding:6px;border-bottom:1px solid var(--edge)}
  #mtabs button{flex:1;font:600 13.5px var(--sans);color:var(--muted);background:transparent;border:0;border-radius:8px;padding:8px 4px;cursor:pointer}
  #mtabs button.on{color:#050811;background:var(--cyan)}
  #mtabs #mcollapse{flex:0 0 44px;font-size:16px;color:var(--text);background:rgba(255,255,255,.05)}
  #mbody{flex:1;overflow-y:auto;padding:12px;-webkit-overflow-scrolling:touch}
  #panel.collapsed #mbody{display:none}
  #panel:not(.t-info) #header{display:none}
  #panel:not(.t-hud) .hudbox,#panel:not(.t-ctl) #controls{display:none}
  #panel.t-hud .hudbox{max-width:420px;margin:0 auto;width:100%}
  #panel:not(.t-notes) #notes{display:none}
  #header{position:static;width:auto;padding:2px 2px 0;background:none;border:0;box-shadow:none;backdrop-filter:none;-webkit-backdrop-filter:none}
  #header .badge.live{display:none}
  #title{font-size:21px}
  #subtitle{font-size:14.5px}
  #analogy{font-size:14px}
  #notes{position:static;transform:none;opacity:1;max-height:none;padding:2px;background:none;border:0;box-shadow:none;backdrop-filter:none;-webkit-backdrop-filter:none;overflow:visible}
  #notes .nhead .k{display:none}
  #notesBody{font-size:15px}
  .btn{padding:11px 13px;font-size:14px}
  .btn small{font-size:12px}
  .note{font-size:13.5px}
}
@media (max-height:500px) and (orientation:landscape){
  #panel{top:10px;bottom:64px;left:auto;right:8px;width:min(46vw,380px);height:auto}
  #panel.collapsed{top:auto;height:48px}
  #mtitle{right:calc(min(46vw,380px) + 20px)}
}
</style>
</head>
<body>
<canvas id="stage" tabindex="0"></canvas>

<header id="header" class="glass">
  <div class="badges"><span class="badge" id="slideBadge">SLIDE 01 / 12</span><span class="badge time" id="timeBadge">~1:00</span><span class="badge live">LIVE 3D</span></div>
  <h1 id="title">The Invisible Battlefield</h1>
  <p id="subtitle"></p>
  <div id="analogy"></div>
</header>

<div id="mtitle" class="glass"></div>
<aside id="panel" class="glass t-info">
  <div id="mtabs"><button data-t="info">Slide</button><button data-t="ctl">Controls</button><button data-t="hud">Scope</button><button data-t="notes">Notes</button><button id="mcollapse" title="Hide / show panel">▾</button></div>
  <div id="mbody">
  <div class="hudbox">
    <div class="hudtitle"><span id="hudTitle">HUD</span><span>SIMULATED</span></div>
    <canvas id="hud" width="624" height="460"></canvas>
  </div>
  <div id="controls"></div>
  </div>
</aside>

<section id="notes" class="glass" aria-label="Speaker notes">
  <div class="nhead"><span>SPEAKER NOTES · <b id="notesSlide"></b></span><span class="k">PRESS N TO CLOSE</span></div>
  <div id="notesBody"></div>
</section>

<nav id="nav" class="glass">
  <button class="navbtn" id="prev" title="Previous (←)">◀ Prev</button>
  <div id="dots"></div>
  <div id="mcount"></div>
  <button class="navbtn" id="next" title="Next (→ / Space)">Next ▶</button>
  <div class="sep"></div>
  <div id="timer">
    <span id="tElapsed">00:00</span><span class="tt">/ 15:00 TARGET</span>
    <button id="tPlay" title="Start / pause timer">▶</button>
    <button id="tReset" title="Reset timer">↺</button>
  </div>
  <div class="sep"></div>
  <button class="navbtn" id="notesBtn" title="Toggle speaker notes (N)">Notes</button>
</nav>
<div id="hint">DRAG TO ORBIT · SCROLL TO ZOOM · ←/→ SPACE TO NAVIGATE · N FOR NOTES</div>
<div id="err"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
(function(){
'use strict';
if(!window.THREE){
  const e=document.getElementById('err');e.style.display='flex';
  e.innerHTML='<div><h2 style="color:#ff2a55;margin-bottom:10px">3D engine could not load</h2>This presentation loads Three.js from a CDN.<br>Please connect to the internet and refresh the page.</div>';
  return;
}
/* ============================================================
   CORE HELPERS
   ============================================================ */
const PI=Math.PI, TAU=PI*2;
const COL={cyan:0x00f0ff,amber:0xffaa00,red:0xff2a55,violet:0xb026ff,green:0x00e676,white:0xffffff};
const HEX={cyan:'#00f0ff',amber:'#ffaa00',red:'#ff2a55',violet:'#b026ff',green:'#00e676',text:'#e6f1ff',muted:'#8ea3c0',dim:'#5b6d88'};
const MONO='"JetBrains Mono",Consolas,"Cascadia Mono",Menlo,monospace';
const SANS='Inter,"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif';
const V=(x=0,y=0,z=0)=>new THREE.Vector3(x,y,z);
const rand=(a=0,b=1)=>a+Math.random()*(b-a);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const smooth=(a,b,x)=>{const t=clamp((x-a)/(b-a),0,1);return t*t*(3-2*t);};
const ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
const damp=(a,b,rate,dt)=>lerp(a,b,1-Math.exp(-rate*dt));

/* ---------- renderer / scene ---------- */
const canvas=document.getElementById('stage');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true});
renderer.setPixelRatio(Math.min(2,window.devicePixelRatio||1));
renderer.setSize(innerWidth,innerHeight,false);
renderer.outputEncoding=THREE.sRGBEncoding;
renderer.setClearColor(0x070b17,1);
const scene=new THREE.Scene();
scene.fog=new THREE.FogExp2(0x070b17,0.014);
const camera=new THREE.PerspectiveCamera(48,innerWidth/innerHeight,0.1,700);
camera.position.set(24,15,30);
let controls;
if(THREE.OrbitControls){
  controls=new THREE.OrbitControls(camera,renderer.domElement);
  controls.enableDamping=true;controls.dampingFactor=0.08;
  controls.minDistance=2;controls.maxDistance=150;controls.maxPolarAngle=PI*0.49;
}else{
  controls={target:V(),update(){camera.lookAt(this.target);},addEventListener(){}};
}
scene.add(new THREE.HemisphereLight(0xa8c8ff,0x0a0f1d,0.8));
const sun=new THREE.DirectionalLight(0xffffff,0.95);sun.position.set(20,40,18);scene.add(sun);
const rim=new THREE.DirectionalLight(0x5ff6ff,0.4);rim.position.set(-25,14,-22);scene.add(rim);
scene.add(new THREE.AmbientLight(0x22304a,0.35));
/* starfield */
(function(){
  const n=1800,p=new Float32Array(n*3);
  for(let i=0;i<n;i++){const r=rand(220,320),th=rand(0,TAU),ph=Math.acos(rand(-0.1,1));
    p[i*3]=r*Math.sin(ph)*Math.cos(th);p[i*3+1]=r*Math.cos(ph);p[i*3+2]=r*Math.sin(ph)*Math.sin(th);}
  const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(p,3));
  const s=new THREE.Points(g,new THREE.PointsMaterial({color:0xa9c1ff,size:1.3,sizeAttenuation:false,transparent:true,opacity:.75,fog:false}));
  s.name='stars';scene.add(s);
})();

/* ---------- materials / mesh helpers ---------- */
function std(color,o={}){return new THREE.MeshStandardMaterial(Object.assign({color,metalness:.45,roughness:.5},o));}
function glow(color,opacity=.6,o={}){return new THREE.MeshBasicMaterial(Object.assign({color,transparent:true,opacity,blending:THREE.AdditiveBlending,depthWrite:false,side:THREE.DoubleSide,fog:false},o));}
function M(geo,mat,x=0,y=0,z=0){const m=new THREE.Mesh(geo,mat);m.position.set(x,y,z);return m;}
function disposeTree(o){
  o.traverse(n=>{
    if(n.geometry)n.geometry.dispose();
    if(n.material){(Array.isArray(n.material)?n.material:[n.material]).forEach(m=>{if(m.map&&m.map!==DOT)m.map.dispose();m.dispose();});}
  });
}
function rr(g,x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath();}
/* text label sprite */
function label(text,color=HEX.cyan,size=1){
  const c=document.createElement('canvas');let g=c.getContext('2d');const fs=46,font=`700 ${fs}px ${SANS}`;

/* beam from a to b (cylinder 0..1 along +z) */
function makeBeam(color,r=.05,opacity=.8){
  const geo=new THREE.CylinderGeometry(r,r,1,10,1,true);geo.rotateX(PI/2);geo.translate(0,0,.5);
  const m=new THREE.Mesh(geo,glow(color,opacity));
  m.userData.set=(a,b)=>{m.position.copy(a);m.lookAt(b);m.scale.z=Math.max(.001,a.distanceTo(b));};

/* cone: apex at origin, opening toward +z, radius 1 & length 1 (scale it) */
function makeCone(color,opacity=.15,seg=40){

/* place object along parametric path, facing travel direction */
function along(obj,f,t){const p=f(t),q=f(t+.05);obj.position.copy(p);obj.rotation.y=Math.atan2(q.x-p.x,q.z-p.z);}

/* ---------- FX manager: rings, shells, bursts ---------- */
class FX{
  constructor(p){this.p=p;this.items=[];this.rg=new THREE.RingGeometry(.9,1,64);this.sg=new THREE.SphereGeometry(1,28,16);}
  add(obj,life,fn){this.p.add(obj);const it={obj,life,age:0,fn};this.items.push(it);fn(0,0);return obj;}
  ring(o){
    const op=o.opacity==null?.8:o.opacity,m=glow(o.color,op),r=new THREE.Mesh(this.rg,m);r.position.copy(o.pos);
    if(o.normal)r.lookAt(r.position.clone().add(o.normal));else r.rotation.x=-PI/2;
    const r0=o.r0==null?.1:o.r0,maxR=o.maxR||5,vel=o.vel||null;
    return this.add(r,o.life||2,(k,dt)=>{r.scale.setScalar(r0+(maxR-r0)*k);m.opacity=op*(1-k)*Math.min(1,k*8+.2);
      if(vel)r.position.addScaledVector(vel,dt);if(o.tick)o.tick(r,k,m);});
  }
  shell(o){
    const op=o.opacity==null?.4:o.opacity,m=glow(o.color,op);if(o.wire)m.wireframe=true;
    const s=new THREE.Mesh(this.sg,m);s.position.copy(o.pos);const maxR=o.maxR||5;
    return this.add(s,o.life||1.4,k=>{s.scale.setScalar(.1+maxR*k);m.opacity=op*(1-k);});
  }
  burst(o){
    const n=o.n||40,pos=new Float32Array(n*3),vel=[];
    for(let i=0;i<n;i++){pos[i*3]=o.pos.x;pos[i*3+1]=o.pos.y;pos[i*3+2]=o.pos.z;
      vel.push(V(rand(-1,1),rand(-1,1)+(o.up||0),rand(-1,1)).normalize().multiplyScalar((o.speed||5)*rand(.25,1)));}
    const geo=new THREE.BufferGeometry();geo.setAttribute('position',new THREE.BufferAttribute(pos,3));
    const m=new THREE.PointsMaterial({map:DOT,color:o.color,size:(o.size||.25)*1.6,transparent:true,blending:THREE.AdditiveBlending,depthWrite:false,fog:false});
    const pts=new THREE.Points(geo,m);pts.frustumCulled=false;pts.userData.ownGeo=true;
    const grav=o.gravity==null?6:o.gravity,d=o.drift||V();
    return this.add(pts,o.life||1.2,(k,dt)=>{for(let i=0;i<n;i++){const v=vel[i];v.y-=grav*dt;
      pos[i*3]+=(v.x+d.x)*dt;pos[i*3+1]+=(v.y+d.y)*dt;pos[i*3+2]+=(v.z+d.z)*dt;}
      geo.attributes.position.needsUpdate=true;m.opacity=1-k*k;});
  }
  update(dt){for(let i=this.items.length-1;i>=0;i--){const it=this.items[i];it.age+=dt;const k=it.age/it.life;if(k>=1){this.kill(i);continue;}it.fn(k,dt);}}
  kill(i){const it=this.items[i];this.p.remove(it.obj);it.obj.material.dispose();if(it.obj.userData.ownGeo)it.obj.geometry.dispose();this.items.splice(i,1);}
  reset(){while(this.items.length)this.kill(this.items.length-1);}
  destroy(){this.reset();this.rg.dispose();this.sg.dispose();}
}
/* packets travelling along a line */
class Packets{
  constructor(parent,color,n=6,size=.12){this.g=new THREE.Group();parent.add(this.g);this.items=[];this.n=n;
    const geo=new THREE.SphereGeometry(size,10,8),mat=glow(color,.95);
    for(let i=0;i<n;i++){const m=new THREE.Mesh(geo,mat);this.g.add(m);this.items.push(m);}}
  update(a,b,t,speed=.5,arc=0){for(let i=0;i<this.n;i++){const k=((t*speed)+i/this.n)%1,m=this.items[i];m.position.lerpVectors(a,b,k);if(arc)m.position.y+=Math.sin(k*PI)*arc;}}
  set visible(v){this.g.visible=v;}
  get visible(){return this.g.visible;}
}
/* particle trail (smoke / sparks) */
class Trail{
  constructor(parent,n,color,size,life=1.4){this.n=n;this.life=life;this.i=0;this.base=new THREE.Color(color);
    this.pos=new Float32Array(n*3);this.col=new Float32Array(n*3);this.age=new Float32Array(n).fill(99);
    const geo=new THREE.BufferGeometry();geo.setAttribute('position',new THREE.BufferAttribute(this.pos,3));geo.setAttribute('color',new THREE.BufferAttribute(this.col,3));
    this.pts=new THREE.Points(geo,new THREE.PointsMaterial({map:DOT,size:size*1.6,vertexColors:true,transparent:true,blending:THREE.AdditiveBlending,depthWrite:false,fog:false}));
    this.pts.frustumCulled=false;parent.add(this.pts);}
  emit(p,j=0){const i=this.i;this.pos[i*3]=p.x+rand(-j,j);this.pos[i*3+1]=p.y+rand(-j,j);this.pos[i*3+2]=p.z+rand(-j,j);this.age[i]=0;this.i=(i+1)%this.n;}
  update(dt,drift){for(let i=0;i<this.n;i++){if(this.age[i]<this.life){this.age[i]+=dt;if(drift){this.pos[i*3]+=drift.x*dt;this.pos[i*3+1]+=drift.y*dt;this.pos[i*3+2]+=drift.z*dt;}
      const f=Math.max(0,1-this.age[i]/this.life);this.col[i*3]=this.base.r*f;this.col[i*3+1]=this.base.g*f;this.col[i*3+2]=this.base.b*f;}
      else{this.col[i*3]=this.col[i*3+1]=this.col[i*3+2]=0;}}
    this.pts.geometry.attributes.position.needsUpdate=true;this.pts.geometry.attributes.color.needsUpdate=true;}
  reset(){this.age.fill(99);}
}
/* char / restore a model (hard-kill look) */
function setCharred(obj,on){
  obj.traverse(n=>{const m=n.material;if(!m)return;
    if(m.isMeshStandardMaterial){if(m.userData.oc==null){m.userData.oc=m.color.getHex();m.userData.oe=m.emissive.getHex();}
      m.color.setHex(on?0x1c1c1e:m.userData.oc);m.emissive.setHex(on?0x000000:m.userData.oe);}
    else if(m.isMeshBasicMaterial){if(m.userData.ov==null)m.userData.ov=n.visible;n.visible=on?false:m.userData.ov;}
  });
}

      dispose(){el.removeEventListener('pointerdown',onDown);el.removeEventListener('pointerup',onUp);el.removeEventListener('pointermove',onMove);el.style.cursor='';},
      update(dt,t){
        ocean.userData.update(t);
        meshes.forEach(o=>{const on=sel!=='ov'&&o.grp===sel;o.m.material.emissiveIntensity=damp(o.m.material.emissiveIntensity,on?.35+.1*Math.sin(t*3):(o.grp?.04:0),6,dt);
          if(o.e)o.e.material.opacity=on?.9:(o.grp?.45:.25);});
        beacons.forEach((b,i)=>{const on=sel==='ov'||b.key===sel;const kk=((t*.8)+i*.17)%1;b.ring.scale.setScalar(1+kk*2.2);b.ring.material.opacity=(1-kk)*(on?.9:.25);
          b.b.material.opacity=on?.75:.2;b.top.material.opacity=on?.7+.3*Math.sin(t*4+i):.25;b.top.material.color.setHex(b.key===sel?COL.amber:COL.cyan);b.ring.material.color.setHex(b.key===sel?COL.amber:COL.cyan);});
        icons.forEach((ic,i)=>{ic.o.rotation.y=t*.5+i;ic.o.position.y=ic.y+Math.sin(t*1.5+i)*.12;});
      },
      hud(g,t){
        hudBg(g);const X=lo=>10+(lo-92)/(127-92)*292,Y=la=>214-(la+9)/(29+9)*200;
        MINI.forEach(([id,pts])=>{const grp=GROUP[id],on=sel!=='ov'&&grp===sel;g.beginPath();pts.forEach(([lo,la],i)=>i?g.lineTo(X(lo),Y(la)):g.moveTo(X(lo),Y(la)));g.closePath();
          g.fillStyle=on?'rgba(0,240,255,.45)':grp?'rgba(60,110,160,.4)':'rgba(60,75,95,.35)';g.fill();g.strokeStyle=on?HEX.cyan:'rgba(0,240,255,.25)';g.lineWidth=1;g.stroke();});
        BEA.forEach(([id,lo,la],i)=>{const on=sel==='ov'||KEYOF[id]===sel;const kk=((t*.8)+i*.17)%1;g.strokeStyle=`rgba(${KEYOF[id]===sel?'255,170,0':'0,240,255'},${(1-kk)*(on?1:.3)})`;g.beginPath();g.arc(X(lo),Y(la),3+kk*10,0,TAU);g.stroke();
          blip(g,X(lo),Y(la),on?1:.35,KEYOF[id]===sel?'255,170,0':'0,240,255',2.5);});
        txt(g,INFO[sel].name.toUpperCase(),10,18,HEX.cyan,11,'left',800);txt(g,INFO[sel].tag.toUpperCase(),10,31,HEX.amber,8,'left',600);
        txt(g,'CLICK THE MAP BEACONS',HW-8,HH-8,HEX.dim,8,'right',600);
      }
    };
  }
});

/* ---------------- SLIDE 12 ---------------- */
SLIDES.push({
  title:'The Future: AI Cognitive Jamming & Key Takeaways',
  sub:'Modern radios and radars hop between frequencies in a blink. Tomorrow’s jammers must learn and predict, not just react.',
  analogy:'Signals change in a blink — now jammers have to think at the speed of light.',
  time:'~1:00',hud:'FREQUENCY WATERFALL',cam:[[15,10,29],[0,4.5,5]],
  notes:`<p><span class="cue">14:00</span>Finally, where is this heading? Modern radios and radars <b>hop</b> between frequencies many times a second to dodge jammers. <span class="act">[Legacy]</span> An old-style, pre-programmed jammer is always one step behind — by the time it arrives, the signal has already moved on.</p>
<p><span class="act">[AI Cognitive]</span> A <b>cognitive</b> jammer uses AI to learn the hopping pattern on the fly, predict the next jump, and be there first. That is the next arms race: machine against machine, at the speed of light.</p>
<p><span class="cue">14:40</span>Three things to remember: the fight starts in the invisible spectrum; Electronic Attack means jam, deceive or destroy; and our region is already living it. Thank you — I’m happy to take your questions.</p>`,
  build({G,P,fx}){
    G.add(makeFloor({color:0x0a0f1e}));
    const LX=[-6,-3,0,3,6],LC=[COL.cyan,COL.green,COL.amber,COL.violet,0x4a7dff],LH=['#00f0ff','#00e676','#ffaa00','#b026ff','#4a7dff'];
    const lanes=LX.map((x,i)=>{const m=M(new THREE.BoxGeometry(1.7,9,.25),glow(LC[i],.07),x,4.85,0);G.add(m);
      const e=new THREE.LineSegments(new THREE.EdgesGeometry(m.geometry),new THREE.LineBasicMaterial({color:LC[i],transparent:true,opacity:.55}));e.position.copy(m.position);G.add(e);
      const l=label('CH '+(i+1),LH[i],.4);l.position.set(x,.75,.9);G.add(l);return{m,e};});
    const eLab=label('ENEMY FREQUENCY-HOPPING SIGNAL',HEX.cyan,.5);eLab.position.set(0,10.2,0);G.add(eLab);
    const orb=M(new THREE.SphereGeometry(.42,20,14),new THREE.MeshBasicMaterial({color:0xffffff}));G.add(orb);const og=glowSprite(COL.cyan,3,.9);orb.add(og);
    const pred=M(new THREE.TorusGeometry(.75,.04,8,32),glow(COL.violet,.9));G.add(pred);
    const truck=makeTruck();truck.position.set(-1.8,.35,12);truck.rotation.y=PI;G.add(truck);
    const trl=label('LEGACY JAMMER',HEX.red,.45);trl.position.set(-1.8,5.6,12);G.add(trl);
    const core=new THREE.Group();core.position.set(2.6,4.2,12);G.add(core);
    const ico=M(new THREE.IcosahedronGeometry(1.3,1),glow(COL.violet,.6,{wireframe:true}));core.add(ico);
    const inner=M(new THREE.SphereGeometry(.65,20,14),glow(COL.violet,.6));core.add(inner);const cg=glowSprite(COL.violet,4,.6);core.add(cg);
    const syn=[];for(let i=0;i<18;i++){const a=V(rand(-1,1),rand(-1,1),rand(-1,1)).normalize().multiplyScalar(1.25),b=V(rand(-1,1),rand(-1,1),rand(-1,1)).normalize().multiplyScalar(1.25);
      const geo=new THREE.BufferGeometry().setFromPoints([a,b]);const ln=new THREE.Line(geo,new THREE.LineBasicMaterial({color:0xe2b0ff,transparent:true,opacity:.5,blending:THREE.AdditiveBlending}));core.add(ln);syn.push(ln);}
    core.add(M(new THREE.CylinderGeometry(.15,.3,3.6,8),std(0x3a2a4a,{metalness:.6}),0,-2.3,0));
    const cl=label('AI COGNITIVE JAMMER',HEX.violet,.45);cl.position.set(2.6,6.4,12);G.add(cl);
    const beam=makeBeam(COL.red,.1,.75),beamC=makeBeam(0xffd0d8,.035,.9);G.add(beam);G.add(beamC);
    const SEQ=[0,3,1,4,2,0,2,4,1,3,0,4],HOP=.8;
    let mode='legacy',hopT=0,idx=0,em=SEQ[0],prev=SEQ[0],emY=5,emYT=5,emX=LX[em],jX=LX[em],jY=5,rowT=0,hitT=0;
    const rows=[],samples=[];
    const s0=sec(P,'Jammer type');
    choice(s0,[{k:'legacy',label:'Legacy Pre-Programmed Jammer',sub:'Reacts after the signal moves',cls:'red'},{k:'ai',label:'AI Cognitive Jammer',sub:'Learns & predicts the next hop',cls:'violet'}],k=>{mode=k;samples.length=0;},{init:'legacy'});
    const tk=h('div','card take');tk.innerHTML=`<div class="ct">KEY TAKEAWAYS</div><ol>
      <li><b>The fight starts in the invisible spectrum</b> — radar, GPS and radio are targets before any shot is fired.</li>
      <li><b>Electronic Attack has three tools:</b> jam (drown out), deceive (lie convincingly) and destroy (fry the electronics).</li>
      <li><b>Southeast Asia is already living it</b> — from grey-zone jamming at sea to counter-drone shields at our airports.</li></ol>
      <div class="qa">Q&amp;A — DISCUSSION OPEN</div>`;P.appendChild(tk);
    return{
      update(dt,t){
        hopT+=dt;if(hopT>=HOP){hopT-=HOP;prev=em;idx=(idx+1)%SEQ.length;em=SEQ[idx];emYT=rand(2.8,7.2);}
        emX=damp(emX,LX[em],28,dt);emY=damp(emY,emYT,28,dt);orb.position.set(emX,emY,.2);
        const ai=mode==='ai';
        if(ai){jX=damp(jX,LX[em],28,dt);jY=damp(jY,emYT,28,dt);}else{jX=damp(jX,LX[prev],5,dt);jY=damp(jY,5,3,dt);}
        const nxt=SEQ[(idx+1)%SEQ.length];pred.visible=ai;pred.position.set(LX[nxt],emY,.3);pred.rotation.y=t*3;pred.material.opacity=.4+.5*(hopT/HOP);
        const src=ai?core.position.clone():truck.userData.tipWorld();const tgt=V(jX,jY,0);beam.userData.set(src,tgt);beamC.userData.set(src,tgt);
        beam.material.color.setHex(ai?COL.violet:COL.red);beam.material.opacity=.5+Math.random()*.3;
        const hit=Math.abs(jX-emX)<.6&&Math.abs(jY-emY)<1.4;
        orb.material.color.setHex(hit?COL.red:0xffffff);og.material.color.setHex(hit?COL.red:COL.cyan);
        lanes.forEach((l,i)=>{const on=i===em;l.m.material.opacity=on?(hit?.22:.14):.05;l.e.material.opacity=on?.95:.4;});
        hitT-=dt;if(hit&&hitT<=0){hitT=.18;fx.burst({pos:orb.position.clone(),color:COL.red,n:12,speed:3,size:.18,gravity:0,life:.5});}
        ico.rotation.y=t*.6;ico.rotation.x=t*.3;inner.material.opacity=ai?.45+.3*Math.sin(t*10):.12;cg.material.opacity=ai?.6:.1;ico.material.opacity=ai?.7:.18;
        syn.forEach((s,i)=>{s.material.opacity=ai?(Math.random()<.3?.95:.15):.05;});
        truck.userData.tipGlow.material.opacity=ai?.15:.5+Math.random()*.4;
        samples.push(hit?1:0);if(samples.length>240)samples.shift();
        rowT-=dt;if(rowT<=0){rowT=.09;let jl=0,bd=99;LX.forEach((x,i)=>{const d=Math.abs(x-jX);if(d<bd){bd=d;jl=i;}});rows.unshift({em,jl,hit});if(rows.length>17)rows.pop();}
      },
      hud(g,t){
        hudBg(g);const cw=50,x0=31,top=24,rh=9;
        txt(g,'TIME ↓',6,top+8,HEX.dim,7.5,'left',600);
        LH.forEach((c,i)=>txt(g,'CH'+(i+1),x0+i*cw+cw/2-2,18,c,8.5,'center',700));
        rows.forEach((r,j)=>{const y=top+j*rh;for(let i=0;i<5;i++){const x=x0+i*cw;g.fillStyle='rgba(142,163,192,.06)';g.fillRect(x,y,cw-4,rh-2);
          if(r.em===i&&r.jl===i){g.fillStyle='rgba(255,90,160,.95)';g.fillRect(x,y,cw-4,rh-2);}
          else{if(r.em===i){g.fillStyle='rgba(0,240,255,.85)';g.fillRect(x,y,cw-4,rh-2);}if(r.jl===i){g.fillStyle='rgba(255,42,85,.6)';g.fillRect(x+4,y+2,cw-12,rh-6);}}}});
        const y2=top+17*rh+12;
        g.fillStyle='rgba(0,240,255,.85)';g.fillRect(10,y2-7,9,7);txt(g,'SIGNAL',23,y2,HEX.muted,8,'left',600);
        g.fillStyle='rgba(255,42,85,.7)';g.fillRect(80,y2-7,9,7);txt(g,'JAMMER',93,y2,HEX.muted,8,'left',600);
        g.fillStyle='rgba(255,90,160,.95)';g.fillRect(152,y2-7,9,7);txt(g,'HIT',165,y2,HEX.muted,8,'left',600);
        const rate=samples.length?samples.reduce((a,b)=>a+b,0)/samples.length:0;
        if(mode==='legacy')statusBar(g,`MISS RATE: HIGH (${Math.round((1-rate)*100)}%)`,HEX.red,t);
        else statusBar(g,`ADAPTIVE LOCK: ${Math.min(99,Math.round(rate*100))}%`,HEX.green,t);
      }
    };
  }
});

/* ============================================================
   PRESENTATION SHELL
   ============================================================ */
const N=SLIDES.length,$=id=>document.getElementById(id),pad=n=>String(n).padStart(2,'0');
const P=$('controls');
let cur=-1,inst={},Gs=null,fxs=null;
const cam={active:false,t:1,dur:1.8,from:V(),to:V(),tf:V(),tt:V()};
const mq=matchMedia('(max-width:760px),(max-height:500px)');
const portrait=()=>mq.matches&&innerWidth<=innerHeight;
/* on tall phone screens, pull the camera back so wide scenes still fit */
function fit(pos,tgt){const k=portrait()?clamp(Math.sqrt(1.5/camera.aspect)*.98,1,2.3):1;return pos.map((v,i)=>tgt[i]+(v-tgt[i])*k);}
function flyTo(pos,tgt,dur=1.8){pos=fit(pos,tgt);cam.from.copy(camera.position);cam.to.set(...pos);cam.tf.copy(controls.target);cam.tt.set(...tgt);cam.t=0;cam.dur=dur;cam.active=true;}
controls.addEventListener('start',()=>{cam.active=false;});

const dotsEl=$('dots');
SLIDES.forEach((S,i)=>{const d=h('button','dot',`<span class="tip"><b>${pad(i+1)}</b>${S.title}</span>`);d.setAttribute('aria-label','Slide '+(i+1)+': '+S.title);d.onclick=()=>go(i);dotsEl.appendChild(d);});

function setHeader(S,i){
  const hd=$('header');hd.classList.add('swap');
  setTimeout(()=>{$('slideBadge').textContent=`SLIDE ${pad(i+1)} / ${pad(N)}`;$('timeBadge').textContent=S.time;$('title').textContent=S.title;
    $('subtitle').textContent=S.sub;$('analogy').textContent=S.analogy?`“${S.analogy}”`:'';hd.classList.remove('swap');},180);
  $('mtitle').innerHTML=`<span class="badge">${pad(i+1)}/${pad(N)}</span><span class="tt">${S.title}</span>`;$('mcount').textContent=`${pad(i+1)} / ${pad(N)}`;
}
function go(i,instant=false){
  i=clamp(i,0,N-1);if(i===cur)return;
  if(Gs){try{inst.dispose&&inst.dispose();}catch(e){console.error(e);}fxs.destroy();scene.remove(Gs);disposeTree(Gs);}
  cur=i;const S=SLIDES[i];
  Gs=new THREE.Group();scene.add(Gs);fxs=new FX(Gs);P.innerHTML='';$('hudTitle').textContent=S.hud;
  try{inst=S.build({G:Gs,P,fx:fxs,fly:flyTo})||{};}catch(e){console.error('Slide '+(i+1)+' failed to build',e);inst={};}
  setHeader(S,i);
  $('notesSlide').textContent=`${pad(i+1)} · ${S.title} · ${S.time}`;$('notesBody').innerHTML=S.notes;
  [...dotsEl.children].forEach((d,k)=>{d.classList.toggle('cur',k===i);d.classList.toggle('done',k<i);});
  $('prev').disabled=i===0;$('next').disabled=i===N-1;
  if(instant){camera.position.set(...fit(S.cam[0],S.cam[1]));controls.target.set(...S.cam[1]);cam.active=false;}else flyTo(S.cam[0],S.cam[1],1.9);
  $('panel').scrollTop=0;$('mbody').scrollTop=0;
  try{history.replaceState(null,'','#'+(i+1));}catch(e){}
}
$('prev').onclick=()=>go(cur-1);$('next').onclick=()=>go(cur+1);

/* notes drawer */
function toggleNotes(force){if(mq.matches){setTab(mTab==='notes'?'ctl':'notes');return;}const n=$('notes'),open=force==null?!n.classList.contains('open'):force;n.classList.toggle('open',open);$('notesBtn').classList.toggle('on',open);}
$('notesBtn').onclick=()=>toggleNotes();

/* pacing timer */
let tRun=false,tEl=0;
const tElapsed=$('tElapsed'),tPlay=$('tPlay');
function drawTimer(){const s=Math.floor(tEl);tElapsed.textContent=`${pad(Math.floor(s/60))}:${pad(s%60)}`;tElapsed.classList.toggle('warn',s>=780&&s<900);tElapsed.classList.toggle('over',s>=900);}
tPlay.onclick=()=>{tRun=!tRun;tPlay.textContent=tRun?'❚❚':'▶';};
$('tReset').onclick=()=>{tEl=0;drawTimer();};

/* keyboard */
addEventListener('keydown',e=>{
  if(e.ctrlKey||e.metaKey||e.altKey)return;
  const t=e.target;if(t&&t.tagName==='INPUT'&&t.type==='range'&&(e.key==='ArrowLeft'||e.key==='ArrowRight'))return;
  if(e.key==='ArrowRight'||e.key==='PageDown'||e.key===' '){e.preventDefault();go(cur+1);}
  else if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();go(cur-1);}
  else if(e.key==='n'||e.key==='N'){toggleNotes();}
  else if(e.key==='Home'){go(0);}else if(e.key==='End'){go(N-1);}
  else if(e.key==='f'||e.key==='F'){if(!document.fullscreenElement)document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen().catch(()=>{});else document.exitFullscreen();}
  else if(e.key==='t'||e.key==='T'){tPlay.click();}
});
document.addEventListener('click',e=>{const b=e.target.closest&&e.target.closest('button');if(b)b.blur();});

/* resize */
/* shift the projection centre left so the 3D scene is framed in the space beside the control panel */
function onResize(){const W=innerWidth,H=innerHeight,r=$('panel').getBoundingClientRect();renderer.setSize(W,H,false);
  if(portrait()){const sh=Math.max(0,Math.round((H-r.top)*.8));camera.fov=58;camera.aspect=W/(H+sh);camera.setViewOffset(W,H+sh,0,sh,W,H);}
  else{const pw=Math.round((r.width+18)*.9);camera.fov=48;camera.aspect=(W+pw)/H;camera.setViewOffset(W+pw,H,pw,0,W,H);}
  camera.updateProjectionMatrix();}
/* phone tabs */
let mTab='info';
function setTab(t){mTab=t;const p=$('panel');p.classList.remove('t-info','t-ctl','t-hud','t-notes','collapsed');p.classList.add('t-'+t);$('mcollapse').textContent='▾';
  document.querySelectorAll('#mtabs [data-t]').forEach(b=>b.classList.toggle('on',b.dataset.t===t));$('mbody').scrollTop=0;setTimeout(onResize,330);}
document.querySelectorAll('#mtabs [data-t]').forEach(b=>b.onclick=()=>setTab(b.dataset.t));
$('mcollapse').onclick=()=>{const p=$('panel'),c=p.classList.toggle('collapsed');$('mcollapse').textContent=c?'▴':'▾';setTimeout(onResize,330);};
function applyMode(){const mb=$('mbody');if(mq.matches){mb.prepend($('header'));mb.appendChild($('notes'));}
  else{document.body.insertBefore($('header'),$('panel'));document.body.insertBefore($('notes'),$('nav'));}setTab(mTab);onResize();if(cur>=0)flyTo(SLIDES[cur].cam[0],SLIDES[cur].cam[1],1);}
mq.addEventListener?mq.addEventListener('change',applyMode):mq.addListener(applyMode);
applyMode();
addEventListener('resize',onResize);onResize();

/* main loop */
const clock=new THREE.Clock();let T=0;const stars=scene.getObjectByName('stars');
function frame(){
  requestAnimationFrame(frame);
  const dt=Math.min(clock.getDelta(),.05);T+=dt;
  if(tRun){const before=Math.floor(tEl);tEl+=dt;if(Math.floor(tEl)!==before)drawTimer();}
  if(cam.active){cam.t+=dt/cam.dur;const k=ease(Math.min(cam.t,1));camera.position.lerpVectors(cam.from,cam.to,k);controls.target.lerpVectors(cam.tf,cam.tt,k);if(cam.t>=1)cam.active=false;}
  try{fxs&&fxs.update(dt);inst.update&&inst.update(dt,T);}catch(e){console.error(e);inst.update=null;}
  try{if(inst.hud){HG.save();inst.hud(HG,T);HG.restore();}}catch(e){console.error(e);inst.hud=null;}
  stars.rotation.y+=dt*.004;
  controls.update();renderer.render(scene,camera);
}
const start=parseInt((location.hash||'').slice(1),10);
go(isNaN(start)?0:start-1,true);drawTimer();
frame();
})();
</script>
